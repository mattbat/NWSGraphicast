[project]
name = "graphicast"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools]
packages = ["graphicast", "graphicast.sources", "graphicast.notify"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network; run with GRAPHICAST_LIVE=1"]

[tool.ruff.lint.per-file-ignores]
# Long lines are inherent to the inline-styled HTML email templates.
"graphicast/render.py" = ["E501"]
"graphicast/widget.py" = ["E501"]
"docs/email_mockup.py" = ["E501"]
"docs/layout_mockup.py" = ["E501"]
"docs/widget_mockup.py" = ["E501", "E701", "E702", "E731", "E401", "E402", "I001"]
